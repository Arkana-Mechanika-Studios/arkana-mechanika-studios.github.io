name: Correct RPG Combat Toolkit logo references

on:
  push:
    branches:
      - agent/correct-product-logo

permissions:
  contents: write

jobs:
  correct-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/correct-product-logo
          fetch-depth: 0

      - name: Replace studio logo in product-brand contexts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("index.html"),
              Path("features/index.html"),
              Path("site.webmanifest"),
          ]

          old = "/assets/logo.png"
          new = "/assets/intro_screen2.png"
          total = 0

          for path in files:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count:
                  path.write_text(text.replace(old, new), encoding="utf-8")
              total += count
              print(f"{path}: replaced {count} occurrence(s)")

          if total == 0:
              raise SystemExit("No product-logo references required replacement.")
          PY

          rm .github/workflows/correct-product-logo.yml

      - name: Commit corrected product identity
        shell: bash
        run: |
          git config user.name "Arkana Mechanika Studios"
          git config user.email "arkana.mechanika.studios@gmail.com"
          git add index.html features/index.html site.webmanifest .github/workflows/correct-product-logo.yml
          git commit -m "Use RPG Combat Toolkit product logo"
          git push origin HEAD:agent/correct-product-logo
